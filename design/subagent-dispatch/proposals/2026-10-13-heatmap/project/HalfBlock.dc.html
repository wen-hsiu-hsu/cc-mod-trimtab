<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>提案 B 半格週曆</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+TC:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;line-height:inherit;display:block}
.t button:focus-visible{outline:1px solid #6cc4e0;outline-offset:0}
.ln{display:flex;height:18px;white-space:pre}
</style>
</helmet>
<div style="width: 1000px; height: 560px; box-sizing: border-box; padding: 32px; background: #0e0e10; font-family: 'Noto Sans TC', sans-serif; color: #d4d4d4; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: baseline; color: #8b8b93; font-size: 13px">
<span>提案 B · 一格上下兩天（▀ 半格字元），4 行畫 {{weeks}} 週</span>
<span>點上半或下半選那一天</span>
</div>
<div class="t" style="flex: 1; background: #1b1b1d; border-radius: 10px; padding: 18px 22px; font-family: 'JetBrains Mono', 'Noto Sans TC', monospace; font-size: 13px; line-height: 18px; overflow: hidden">
<div style="width: {{cols}}ch; height: 100%; display: flex; flex-direction: column">
<div class="ln"><span style="font-weight: 700">subagent-dispatch stats </span><span style="color: #55555c; overflow: hidden">{{rule}}</span></div>
<div class="ln"> </div>
<div class="ln" style="color: #7d7d85"><span style="width: 4ch"></span><sc-for list="{{months}}" as="m" hint-placeholder-count="20"><span style="width: 2ch; overflow: visible">{{m.label}}</span></sc-for></div>
<sc-for list="{{pairs}}" as="row" hint-placeholder-count="4">
<div style="display: flex; height: 18px"><span style="width: 4ch; color: #7d7d85; white-space: pre">{{row.label}}</span><sc-for list="{{row.cells}}" as="c" hint-placeholder-count="50"><span style="width: 2ch; display: flex; flex-direction: column"><button type="button" aria-label="{{c.topAria}}" onClick="{{c.topPick}}" style="width: 2ch; height: 9px; background: {{c.top}}"></button><button type="button" aria-label="{{c.botAria}}" onClick="{{c.botPick}}" style="width: 2ch; height: 9px; background: {{c.bot}}"></button></span></sc-for></div>
</sc-for>
<sc-if value="{{hasNoData}}" hint-placeholder-val="{{ true }}">
<div class="ln" style="color: #7d7d85"><span style="width: 4ch"></span><span style="width: {{noW}}ch; display: flex; align-items: center"><span>└</span><span style="flex: 1; border-top: 1px solid #55555c"></span><span> {{noLabel}} </span><span style="flex: 1; border-top: 1px solid #55555c"></span><span>┘</span></span></div>
</sc-if>
<div class="ln"><span style="width: 4ch"></span><span style="width: {{caretPad}}ch"></span><span style="color: #ffffff; font-weight: 700">{{caret}}</span></div>
<div class="ln"><span style="width: 4ch"></span><span style="color: #7d7d85">無資料 </span><span style="color: #7d7d85">空白＋└─┘  無用量 </span><span style="width: 2ch; background: #3a3a40"></span><span style="color: #7d7d85">  少 </span><span style="width: 2ch; background: #173f4d"></span><span style="width: 2ch; background: #1f6680"></span><span style="width: 2ch; background: #2f8fb0"></span><span style="width: 2ch; background: #6cc4e0"></span><span style="color: #7d7d85"> 多   選到 </span><span style="width: 2ch; background: #f2f2f2"></span><span style="color: #7d7d85">   最多 </span><span>{{peak}}</span></div>
<div class="ln"> </div>
<div class="ln"><span style="color: #7d7d85">期間  </span><button type="button" onClick="{{cyclePeriod}}" style="display: inline"><span>p: </span><span style="font-weight: 700">‹ {{periodLabel}} ›</span></button><span style="color: #7d7d85">  {{periodRange}}</span><span style="flex: 1"></span><button type="button" onClick="{{prevDay}}" style="display: inline">j: ‹ 前一天</button><span>  </span><button type="button" onClick="{{nextDay}}" style="display: inline">k: 後一天 ›</button></div>
<div class="ln"> </div>
<div class="ln"><span style="color: #7d7d85">{{summary}}</span></div>
<div class="ln"><span style="color: #55555c">（卡片、快取讀取與分組清單照舊，數字跟著期間）</span></div>
<div style="flex: 1"></div>
<div class="ln"><span>Tab</span><span style="color: #7d7d85"> 移動 · </span><span>Enter</span><span style="color: #7d7d85"> 打開一列 · </span><span>Esc</span><span style="color: #7d7d85"> 關閉</span></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cols":{"editor":"enum","options":["80","110"],"default":"110"},"scenario":{"editor":"enum","options":["30 天（未選日）","選了一天","選到無用量的日子","選到無資料的日子"],"default":"選了一天"},"$preview":{"width":1000,"height":560}}'>
class Component extends DCLogic {
  key(d) { const p = (n) => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
  md(d) { const p = (n) => String(n).padStart(2, '0'); return p(d.getMonth() + 1) + '/' + p(d.getDate()); }
  fmt(n) { if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M'; if (n >= 1e3) return Math.round(n / 1e3) + 'k'; return String(n); }
  hash(n, s) { const x = Math.sin(n * 12.9898 + s * 78.233) * 43758.5453; return x - Math.floor(x); }
  day(d) {
    if (d < new Date(2026, 8, 15)) return null;
    if (this.key(d) === '2026-10-02') return { tokens: 1240000, sub: 0.46 };
    const n = Math.round(d.getTime() / 864e5);
    const wd = (d.getDay() + 6) % 7;
    const h = this.hash(n, 1);
    if ((wd >= 5 && h < 0.6) || (wd < 5 && h < 0.1)) return { tokens: 0, sub: 0 };
    const h2 = this.hash(n, 2);
    return { tokens: Math.round(60000 + h2 * h2 * 1050000), sub: 0.18 + this.hash(n, 3) * 0.4 };
  }
  renderVals() {
    const cols = Number(this.props.cols ?? '110');
    const weeks = Math.min(53, Math.max(4, Math.floor((cols - 4) / 2)));
    const today = new Date(2026, 9, 13);
    const dow = (today.getDay() + 6) % 7;
    const start = new Date(2026, 9, 13 - dow - (weeks - 1) * 7);
    const at = (w, r) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + r);
    const WD = ['一', '二', '三', '四', '五', '六', '日'];

    const vals = []; let peak = null; let firstZero = null;
    for (let w = 0; w < weeks; w++) for (let r = 0; r < 7; r++) {
      const d = at(w, r); if (d > today) continue;
      const v = this.day(d);
      if (v && v.tokens > 0) { vals.push(v.tokens); if (!peak || v.tokens > peak.tokens) peak = { d, tokens: v.tokens }; }
      if (v && v.tokens === 0 && !firstZero) firstZero = this.key(d);
    }
    vals.sort((a, b) => a - b);
    const q = (p) => vals[Math.min(vals.length - 1, Math.floor(vals.length * p))];
    const q1 = q(0.25), q2 = q(0.5), q3 = q(0.75);
    const LV = ['#3a3a40', '#173f4d', '#1f6680', '#2f8fb0', '#6cc4e0'];

    const scen = this.props.scenario ?? '選了一天';
    const initial = scen === '選了一天' ? '2026-10-02' : scen === '選到無用量的日子' ? firstZero : scen === '選到無資料的日子' ? '2026-09-08' : null;
    const sel = this.state.touched ? this.state.sel : initial;
    const period = this.state.period ?? 30;
    const setSel = (k) => this.setState({ touched: true, sel: k });

    const color = (d) => {
      if (!d || d > today) return 'transparent';
      if (this.key(d) === sel) return '#f2f2f2';
      const v = this.day(d);
      if (!v) return 'transparent';
      if (v.tokens === 0) return LV[0];
      return LV[v.tokens <= q1 ? 1 : v.tokens <= q2 ? 2 : v.tokens <= q3 ? 3 : 4];
    };
    const aria = (d) => { const v = this.day(d); return this.key(d) + ' ' + (!v ? '沒有資料' : v.tokens === 0 ? '沒有用量' : this.fmt(v.tokens) + ' token'); };
    const pick = (d) => () => { if (d && d <= today) setSel(this.key(d)); };
    const labels = ['一二', '三四', '五六', '日  '];
    const pairs = [0, 1, 2, 3].map((p) => {
      const cells = [];
      for (let w = 0; w < weeks; w++) {
        const a = at(w, p * 2);
        const b = p < 3 ? at(w, p * 2 + 1) : null;
        cells.push({ top: color(a), bot: color(b), topAria: aria(a), botAria: b ? aria(b) : '', topPick: pick(a), botPick: pick(b) });
      }
      return { label: labels[p], cells };
    });

    const months = []; let lastM = -1;
    for (let w = 0; w < weeks; w++) {
      const m = at(w, 6).getMonth();
      months.push({ label: m !== lastM && w > 0 ? (m + 1) + '月' : '' });
      lastM = m;
    }
    let noWeeks = 0;
    for (let w = 0; w < weeks; w++) if (!this.day(at(w, 6))) noWeeks = w + 1;
    const firstData = new Date(2026, 8, 15);
    const noLabel = this.md(new Date(2026, 8, 14)) + ' 以前沒有資料';

    let caret = '', caretPad = 0;
    if (sel) {
      const [y, m, dd] = sel.split('-').map(Number);
      const d = new Date(y, m - 1, dd);
      const w = Math.floor((d - start) / 864e5 / 7);
      caretPad = w * 2;
      caret = '▲ ' + this.md(d) + ' 週' + WD[(d.getDay() + 6) % 7];
      if (caretPad + 12 > cols - 4) { caretPad = Math.max(0, cols - 4 - 12); }
    }

    let label, range, summary;
    if (sel) {
      const [y, m, dd] = sel.split('-').map(Number);
      const d = new Date(y, m - 1, dd);
      const v = this.day(d);
      label = this.md(d) + ' 週' + WD[(d.getDay() + 6) % 7];
      range = '1 天 · p 回到 ' + period + ' 天';
      summary = !v ? this.md(d) + ' 沒有資料（帳本與每日摘要都沒有這天）。' : v.tokens === 0 ? this.md(d) + ' 沒有用量（有紀錄，0 token）。' : '總 token ' + this.fmt(v.tokens) + ' · subagent ' + Math.round(v.sub * 100) + '% · 派出 ' + Math.max(1, Math.round(v.tokens * v.sub / 42000)) + ' 次';
    } else {
      let t = 0;
      for (let i = 0; i < period; i++) { const v = this.day(new Date(2026, 9, 13 - i)); if (v) t += v.tokens; }
      label = period === 1 ? '今天' : period + ' 天';
      range = period === 1 ? '10/13' : this.md(new Date(2026, 9, 13 - period + 1)) + ' – 10/13';
      summary = '總 token ' + this.fmt(t);
    }

    return {
      cols, weeks, pairs, months, rule: '─'.repeat(Math.max(0, cols - 24)),
      hasNoData: noWeeks > 0, noW: noWeeks * 2, noLabel, caret, caretPad,
      peak: peak ? this.md(peak.d) + ' ' + this.fmt(peak.tokens) : '—',
      periodLabel: label, periodRange: range, summary,
      cyclePeriod: () => { if (sel) { this.setState({ touched: true, sel: null }); return; } const o = [1, 7, 30, 90]; this.setState({ period: o[(o.indexOf(period) + 1) % 4] }); },
      prevDay: () => { const b = sel ? sel.split('-').map(Number) : [2026, 10, 14]; const d = new Date(b[0], b[1] - 1, b[2] - 1); if (d >= start) setSel(this.key(d)); },
      nextDay: () => { if (!sel) return; const b = sel.split('-').map(Number); const d = new Date(b[0], b[1] - 1, b[2] + 1); if (d <= today) setSel(this.key(d)); },
    };
  }
}
</script>
</body>
</html>
