<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>C 55 欄</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+TC:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6cc4e0}a:hover{color:#86d6f0}
.ln{display:flex;height:18px;white-space:pre}
.bar{display:inline-block;height:12px;margin-top:3px}
.c{display:inline-block;flex-shrink:0;overflow:hidden}
.r{text-align:right}
.fold{position:absolute;left:-1ch;right:-1ch;bottom:0;background:rgba(14,14,16,.6);border-top:1px dashed #ff8c42;pointer-events:none}
.fold span{position:absolute;right:0;top:-18px;color:#ff8c42;font-size:11px}
</style>
</helmet>
<div style="width: 480px; height: 1080px; box-sizing: border-box; padding: 20px; background: #0e0e10; font-family: 'Noto Sans TC', sans-serif; color: #d4d4d4; display: flex; flex-direction: column; gap: 10px">
<div style="color: #8b8b93; font-size: 13px">C · 「依日期」清單本身就是時間軸，熱圖收成一行週條（y 展開成 7 列）</div>
<div style="background: #1b1b1d; border-radius: 10px; padding: 14px 16px; font-family: 'JetBrains Mono', 'Noto Sans TC', monospace; font-size: 12px; line-height: 18px; overflow: hidden">
<div style="width: 55ch; display: flex; flex-direction: column; position: relative">

<div class="ln" style="justify-content: space-between"><span><span style="font-weight: 700; color: #f0f0f0">subagent-dispatch stats </span><span style="color: #3a3a40">────────────────────</span></span><span style="color: #6b6b73"> 19:04 更新</span></div>
<div class="ln"> </div>
<div class="ln"><span style="color: #6b6b73; display: inline-block; width: 6ch">25 週</span><sc-for list="{{strip}}" as="s" hint-placeholder-count="25"><span style="color: {{s.color}}">{{s.ch}}</span></sc-for><span style="color: #6b6b73">  y 展開</span></div>
<div class="ln"><span style="display: inline-block; width: 6ch"></span><span style="color: #6b6b73">5月</span><span style="display: inline-block; width: 15ch"></span><span style="color: #6b6b73">今天</span></div>
<div class="ln"> </div>
<div class="ln"><span style="color: #6b6b73">期間 </span><span>p ‹ <b>30 天</b> ›</span><span style="color: #6b6b73">  09/15 – 10/14</span></div>
<div class="ln"> </div>
<div class="ln" style="justify-content: space-between"><span><b style="color: #f0f0f0">12.4M</b><span style="color: #6b6b73"> token</span></span><span><span style="color: #b48ee6">主</span> 8.4M  <span style="color: #3aa6cc">sub</span> 4.0M</span></div>
<div class="ln"><span class="bar" style="width: 37ch; background: #8a5cc7"></span><span class="bar" style="width: 18ch; background: #2f8fb0"></span></div>
<div class="ln" style="justify-content: space-between"><span><b style="color: #f0f0f0">46</b><span style="color: #6b6b73"> 次派出</span></span><span><span style="color: #d7b84a">指定</span> 14 <span style="color: #8b8b93">預設</span> 24 <span style="color: #5fb36b">fork</span> 8</span></div>
<div class="ln"><span class="bar" style="width: 17ch; background: #c98a12"></span><span class="bar" style="width: 28ch; background: #8b8b93"></span><span class="bar" style="width: 10ch; background: #3f9a4f"></span></div>
<div class="ln"> </div>
<div class="ln" style="color: #6b6b73; border-bottom: 1px solid #3a3a40; height: 19px"><span class="c" style="width: 13ch; color: #f0f0f0">g ‹ <b>依日期</b> ›</span><span class="c r" style="width: 6ch">token</span><span class="c" style="width: 1ch"></span><span class="c" style="width: 30ch"></span><span class="c r" style="width: 5ch">派出</span></div>
<sc-for list="{{days}}" as="d" hint-placeholder-count="14">
<div class="ln"><span class="c" style="width: 13ch; color: {{d.ink}}">{{d.name}}</span><span class="c r" style="width: 6ch; color: {{d.ink}}">{{d.tok}}</span><span class="c" style="width: 1ch"></span><span class="c" style="width: 30ch"><span class="bar" style="width: {{d.mainW}}ch; background: #8a5cc7"></span><span class="bar" style="width: {{d.subW}}ch; background: #2f8fb0"></span></span><span class="c r" style="width: 5ch; color: {{d.ink}}">{{d.spawns}}</span></div>
</sc-for>
<div class="ln"><span style="color: #8b8b93">m 還有 16 天</span></div>
<div class="ln"> </div>
<div class="ln" style="color: #6b6b73">Tab 移動 · Enter 打開一列 · Esc 關閉</div>
<div class="fold" style="top: 540px"><span>dock 首屏 30 列</span></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":1080}}'>
class Component extends DCLogic {
  hash(n, s) { const x = Math.sin(n * 12.9898 + s * 78.233) * 43758.5453; return x - Math.floor(x); }
  tok(d) {
    if (d < new Date(2026, 4, 18)) return -1;
    const n = Math.round(d.getTime() / 864e5);
    const wd = (d.getDay() + 6) % 7;
    const h = this.hash(n, 1);
    if ((wd >= 5 && h < 0.6) || (wd < 5 && h < 0.1)) return 0;
    const h2 = this.hash(n, 2);
    return Math.round(60000 + h2 * h2 * 1050000);
  }
  renderVals() {
    const today = new Date(2026, 9, 14);
    const dow = (today.getDay() + 6) % 7;
    const weeks = 25;
    const start = new Date(2026, 9, 14 - dow - (weeks - 1) * 7);
    const wk = [];
    for (let w = 0; w < weeks; w++) { let s = 0, known = false; for (let r = 0; r < 7; r++) { const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + r); if (d > today) continue; const t = this.tok(d); if (t >= 0) { known = true; s += t; } } wk.push({ s, known }); }
    const wmax = Math.max(...wk.map((x) => x.s));
    const E = '▁▂▃▄▅▆▇█';
    const begin = new Date(2026, 8, 15);
    const strip = wk.map((x, w) => {
      const inP = w >= Math.floor((begin - start) / (7 * 864e5));
      if (!x.known) return { ch: '· ', color: '#55555c' };
      return { ch: E[Math.min(7, Math.floor((x.s / wmax) * 7.99))] + ' ', color: inP ? '#3aa6cc' : '#2a5f72' };
    });
    const WD = ['一', '二', '三', '四', '五', '六', '日'];
    const short = (t) => t >= 1e6 ? (t / 1e6).toFixed(2) + 'M' : Math.round(t / 1e3) + 'k';
    let max = 0;
    const all = [];
    for (let i = 0; i < 14; i++) { const d = new Date(2026, 9, 14 - i); const t = this.tok(d); all.push({ d, t }); max = Math.max(max, t); }
    const days = all.map(({ d, t }) => {
      const name = String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0') + ' ' + WD[(d.getDay() + 6) % 7] + (d.getTime() === today.getTime() ? ' 今天' : '');
      if (t <= 0) return { name, tok: '—', spawns: '', mainW: 0, subW: 0, ink: '#6b6b73' };
      const tw = Math.max(1, Math.round((t / max) * 30));
      const subW = Math.max(1, Math.round(tw * (0.2 + this.hash(t, 3) * 0.35)));
      return { name, tok: short(t), spawns: Math.round(t / 270000), mainW: tw - subW, subW, ink: '#d4d4d4' };
    });
    return { strip, days };
  }
}
</script>
</body>
</html>
